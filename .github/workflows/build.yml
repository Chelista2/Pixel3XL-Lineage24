name: Build LineageOS 24.0 for crosshatch

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Nur Verbindung & Server-Check testen (kein repo sync / kein Build)'
        required: true
        default: true
        type: boolean
      force_clean:
        description: 'Build-Output (out/) vor dem Start manuell leeren'
        required: false
        default: false
        type: boolean

jobs:
  build:
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verbindung & Server-Status testen (Dry Run)
        if: ${{ inputs.dry_run }}
        shell: bash
        run: |
          echo "Verbindung steht! Host: $(hostname), User: $(whoami)"
          ls -la "${{ github.workspace }}/local_manifests/crosshatch.xml"
          df -h "$HOME"
          free -h

      - name: Sync & Build LineageOS 24.0 for crosshatch
        if: ${{ !inputs.dry_run }}
        shell: bash
        run: |
          set -e
          export PATH="$HOME/bin:$PATH"
          export USE_CCACHE=1
          export CCACHE_EXEC=/usr/bin/ccache
          export ROOMSERVICE_BRANCHES="lineage-23.0"

          BUILD_DIR="$HOME/android/lineage"
          FAIL_MARKER="$BUILD_DIR/.last_build_failed"

          mkdir -p "$BUILD_DIR"
          cd "$BUILD_DIR"

          # Bei fehlgeschlagenem Vorlauf oder force_clean nur out/ löschen (Repos bleiben erhalten)
          if [ -f "$FAIL_MARKER" ] || [ "${{ inputs.force_clean }}" = "true" ]; then
            echo "Lösche alten/fehlerhaften Build-Output (out/), Repos bleiben erhalten..."
            rm -rf "$BUILD_DIR/out"
            rm -f "$FAIL_MARKER"
          fi

          # Marker setzen (wird erst nach erfolgreichem Build wieder entfernt)
          touch "$FAIL_MARKER"

          git config --global user.name "Chelista2"
          git config --global user.email "chelista2@users.noreply.github.com"

          if [ ! -d ".repo" ]; then
            repo init -u https://github.com/LineageOS/android.git -b lineage-24.0 --depth=1 --git-lfs
          fi

          mkdir -p .repo/local_manifests
          cp -f "${{ github.workspace }}/local_manifests/crosshatch.xml" .repo/local_manifests/crosshatch.xml

          repo sync -c -j8 --force-sync --no-clone-bundle --no-tags --optimized-fetch

          # Legacy-Defaults in gs-common entfernen, die es unter LineageOS 24.0 nicht mehr gibt
          sed -i '/powerstats_pixel_defaults/d' "$BUILD_DIR/device/google/gs-common/powerstats/Android.bp"

          source build/envsetup.sh
          lunch lineage_crosshatch trunk_staging userdebug
          mka bacon

          # Build erfolgreich -> Marker entfernen
          rm -f "$FAIL_MARKER"
          df -h "$HOME"
